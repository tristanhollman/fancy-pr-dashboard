name: Draft release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ github.ref_name }}

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require a commit merged into master
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/master
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: 1.3.11
      - run: bun install --frozen-lockfile
      - run: bun run scripts/check-release.ts
      - run: bun test ./src
      - run: bun run typecheck

  build:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64
          - os: windows-latest
            target: windows-x64
    runs-on: ${{ matrix.os }}
    env:
      RELEASE_TARGET: ${{ matrix.target }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: 1.3.11
      - run: bun install --frozen-lockfile
      - run: bun run scripts/build-release.ts "$RELEASE_TARGET"
      - run: bun run scripts/smoke-release.ts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fpr-${{ matrix.target }}
          path: dist/fpr-*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  draft:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: 1.3.11
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: fpr-*
          path: dist
          merge-multiple: true
      - run: bun run scripts/check-release.ts
      - run: bun run scripts/release.ts
      - name: Create draft with versioned binaries and checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" --draft --verify-tag \
            --title "FancyPRDashboard $RELEASE_TAG" \
            --notes-file dist/RELEASE_NOTES.md \
            "dist/fpr-${RELEASE_TAG}-linux-x64" \
            "dist/fpr-${RELEASE_TAG}-windows-x64.exe" \
            dist/SHA256SUMS
